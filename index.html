<!DOCTYPE html>
<html lang="de" data-theme="obsidian">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hermes</title>
<meta name="theme-color" content="#0A0A0A" id="themeColor" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Hermes" />
<link rel="manifest" href="manifest.json" />
<link id="appleicon" rel="apple-touch-icon" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root[data-theme="obsidian"]{--bg:#0A0A0A;--surface:#151515;--surface2:#1E1E1E;--line:#2C2C2C;--text:#F2F0EB;--muted:#8B887F;--hair:#242424;--inv-bg:#F2F0EB;--inv-fg:#0A0A0A;}
:root[data-theme="marmor"]{--bg:#F3F1EB;--surface:#FCFBF7;--surface2:#EAE7DE;--line:#D6D1C4;--text:#16130C;--muted:#6B6658;--hair:#E2DDD0;--inv-bg:#16130C;--inv-fg:#F3F1EB;}
:root[data-theme="ocean"]{--bg:#0B141D;--surface:#12212D;--surface2:#1B3040;--line:#2F485A;--text:#E5F1F8;--muted:#A0B8C9;--hair:#233A4A;--inv-bg:#B0DDF4;--inv-fg:#102330;}
:root[data-theme="forest"]{--bg:#0E1612;--surface:#18251D;--surface2:#24372B;--line:#3A5142;--text:#EDF3EA;--muted:#ACBDAC;--hair:#2C4032;--inv-bg:#C3DDB5;--inv-fg:#18251D;}
:root[data-theme="purple"]{--bg:#15111D;--surface:#221B2E;--surface2:#30263F;--line:#4B3D60;--text:#F2ECFA;--muted:#BEB0D0;--hair:#3A2E4C;--inv-bg:#DBC5F5;--inv-fg:#251B33;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;padding-bottom:calc(70px + env(safe-area-inset-bottom));}
.hd{padding:calc(18px + env(safe-area-inset-top)) 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;}
.wordmark{font-weight:800;font-size:24px;letter-spacing:-0.5px;}
.tagline{font-size:12px;color:var(--muted);}
.main{flex:1;padding:14px;}
.stack{display:flex;flex-direction:column;gap:12px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;}
.eyebrow{font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.body{font-size:15px;line-height:1.5;margin:0;}
.muted{color:var(--muted);font-size:14px;line-height:1.45;}
.sm{font-size:13px;}
.row{display:flex;align-items:center;gap:8px;}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;}
h3.sec{font-size:15px;font-weight:700;margin:2px 0 0;}

.shiftrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.chip{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600;font-size:14px;padding:12px 2px;border-radius:10px;cursor:pointer;transition:.12s;}
.chip--on{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg);}

.hero{border-left:4px solid var(--text);}
.hero-tag{font-weight:800;font-size:22px;}
.hero-when{font-weight:600;font-size:15px;margin-top:2px;}
.hero-note{font-size:14px;line-height:1.5;color:var(--muted);margin:8px 0 14px;}
.hero-rest{font-weight:600;color:var(--muted);}
.hero--empty{border-left:1px dashed var(--line);color:var(--muted);font-size:15px;line-height:1.5;}

.btn{width:100%;background:var(--inv-bg);color:var(--inv-fg);border:none;border-radius:10px;font-weight:700;font-size:15px;padding:14px;cursor:pointer;transition:.12s;}
.btn:active{opacity:.82;}.btn:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn-sm{padding:10px;font-size:13px;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat{display:flex;flex-direction:column;gap:4px;}
.stat-num{font-weight:800;font-size:34px;line-height:.95;}
.stat-num .u{font-size:15px;color:var(--muted);margin-left:2px;font-weight:600;}
.stat-lbl{font-size:13px;color:var(--muted);line-height:1.2;}

.dayswitch{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.daybtn{flex:1;min-width:70px;background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600;font-size:14px;padding:11px 6px;border-radius:10px;cursor:pointer;position:relative;}
.daybtn--on{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg);}
.dot{position:absolute;top:3px;right:6px;font-size:9px;font-weight:600;}

.progress{height:4px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:6px;}
.progress-bar{height:100%;background:var(--text);transition:width .25s;}

.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.ex-name{font-weight:700;font-size:17px;}
.ex-target{font-size:13px;color:var(--muted);white-space:nowrap;}
.lastline{font-size:13px;color:var(--muted);margin-top:3px;}
.lastline b{color:var(--text);}
details.steps{margin-top:8px;}
details.steps summary{font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;list-style:none;text-transform:uppercase;letter-spacing:.5px;}
details.steps summary::-webkit-details-marker{display:none;}
details.steps summary::before{content:"＋ ";}
details.steps[open] summary::before{content:"− ";}
details.steps ol{margin:8px 0 0;padding-left:18px;}
details.steps li{font-size:13px;line-height:1.5;color:var(--text);margin-bottom:3px;}
.sethead{display:grid;grid-template-columns:26px 1fr 1fr 42px;gap:8px;margin:12px 0 6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.sethead span{text-align:center;}.sethead span:first-child{text-align:left;}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 42px;gap:8px;align-items:center;margin-bottom:7px;}
.setrow--done{opacity:.5;}
.set-swipe{position:relative;overflow:hidden;border-radius:12px;margin-bottom:7px;touch-action:pan-y pinch-zoom;background:var(--surface2)}
.set-swipe .setrow{position:relative;z-index:1;margin-bottom:0;padding:3px 0;background:var(--surface);transition:transform .18s ease-out;touch-action:pan-y pinch-zoom}
.set-swipe .setrow--done{opacity:1}.set-swipe .setrow--done>*{opacity:.5}
.set-swipe.dragging .setrow{transition:none;user-select:none}
.set-swipe.open .setrow{transform:translateX(-82px)}
.set-swipe.ready{background:var(--inv-bg)}
.set-remove{position:absolute;inset:0 0 0 auto;width:82px;border:0;background:transparent;color:var(--text);font-size:11px;font-weight:600;cursor:pointer;padding:4px}
.set-swipe.ready .set-remove{color:var(--inv-fg)}
.setnum-button{border:0;background:transparent;font:inherit;min-height:44px;padding:0;cursor:pointer;color:var(--muted)}
.set-swipe .setnum-button:focus-visible{outline-offset:-2px}.set-swipe .setrow:focus-within{overflow:visible}
.set-undo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;font-size:12px;background:var(--surface2)}
.set-undo button{border:0;background:none;color:var(--text);font-weight:600;padding:10px 0;min-height:44px;cursor:pointer}
.toast button{margin-left:14px;padding:8px 0;border:0;background:none;color:inherit;text-decoration:underline;font-weight:700;cursor:pointer;min-height:44px}
.workout-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.workout-title{font-size:19px;font-weight:700;letter-spacing:-.4px}.workout-meta{font-size:12px;color:var(--muted);margin-top:6px}.workout-head .btn{width:auto;min-width:94px}
.sethead,.setrow{grid-template-columns:46px minmax(42px,1fr) minmax(44px,.8fr) minmax(44px,.8fr) 42px;gap:5px}
.sethead span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.set-label{display:flex;align-items:center;gap:2px}.set-label .setnum-button{width:19px;flex:none}.set-type{border:1px solid var(--line);background:var(--surface2);color:var(--muted);font:700 10px Inter,system-ui,sans-serif;border-radius:8px;width:25px;min-height:44px;padding:0;cursor:pointer}.set-type:not(.set-type--normal){background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.set-prev{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.set-prev--empty{opacity:.55}.setrow .inp{min-width:0;padding:9px 3px}
.set-legend{font-size:11px;color:var(--muted);line-height:1.5;margin:8px 0 0}
.ex-note{display:block;width:100%;margin-top:10px;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);font:12px Inter,system-ui,sans-serif}.ex-note::placeholder{color:var(--muted)}.ex-note:focus{outline:2px solid var(--text);outline-offset:1px}
.ex-history-link{font-size:11px;min-height:44px;margin-top:4px}.ex-history-chart{width:100%;height:86px;margin-top:8px;background:var(--surface2);border-radius:12px;padding:8px}.ex-history-item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--hair);padding:8px 0;font-size:12px}.ex-history-item span{color:var(--muted)}
.setnum{font-weight:600;color:var(--muted);text-align:center;}
.inp{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px 8px;font-size:16px;text-align:center;width:100%;font-family:inherit;}
.inp:focus{outline:none;border-color:var(--text);}.inp:disabled{opacity:.35;}
.check{background:transparent;border:1px solid var(--line);color:transparent;border-radius:9px;height:42px;cursor:pointer;font-size:17px;transition:.1s;}
.check--on{background:var(--inv-bg);border-color:var(--inv-bg);color:var(--inv-fg);}
.restbtn{margin-top:10px;background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:12px;font-weight:600;padding:9px;border-radius:9px;cursor:pointer;width:100%;}
.notearea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:12px;font-family:inherit;font-size:15px;resize:vertical;min-height:52px;}
.notearea:focus{outline:none;border-color:var(--text);}
.tip{font-size:13px;color:var(--muted);line-height:1.45;text-align:center;margin:2px 6px 0;}
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 18px;}
.done-check{width:56px;height:56px;border-radius:50%;background:var(--inv-bg);color:var(--inv-fg);font-size:28px;display:flex;align-items:center;justify-content:center;}
.done-title{font-weight:800;font-size:20px;}

.weighrow{display:flex;align-items:center;gap:8px;}
.inp--big{font-size:18px;flex:1;text-align:left;}
.kglabel{color:var(--muted);}
.addbtn{background:var(--inv-bg);color:var(--inv-fg);border:none;border-radius:9px;padding:13px 16px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;}
.trend{margin-top:10px;font-weight:700;font-size:15px;text-align:center;}
.axis{fill:var(--muted);font-size:10px;}
.bwlist{margin-top:14px;border-top:1px solid var(--hair);}
.bwitem{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair);font-size:14px;}
.del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:17px;padding:2px 8px;}

/* nutrient bars */
.nut{margin-bottom:11px;}
.nut-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
.nut-top b{font-weight:600;}
.nut-val{color:var(--muted);}
.nut-bar{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;}
.nut-fill{height:100%;background:var(--text);border-radius:4px;}
.nut-fill.over{background:var(--muted);}
.kcal-big{text-align:center;padding:6px 0 4px;}
.kcal-big .n{font-weight:800;font-size:40px;line-height:1;}
.kcal-big .l{color:var(--muted);font-size:13px;margin-top:2px;}
.wkchart{position:relative;display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:4px;}
.wkbar{flex:1;background:var(--surface2);border-radius:4px 4px 0 0;min-height:2px;}
.wkbar--today{background:var(--text);}
.wkbar--empty{background:var(--hair);}
.wktgt{position:absolute;left:0;right:0;border-top:1px dashed var(--muted);z-index:1;}
.wklbls{display:flex;gap:6px;margin-top:5px;}
.wklbls span{flex:1;text-align:center;font-size:10px;color:var(--muted);}

.foodentry{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair);}
.foodentry .fn{font-size:14px;font-weight:500;}
.foodentry .fd{font-size:12px;color:var(--muted);}
.water-btns{display:flex;gap:8px;}
.water-btns button{flex:1;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px;font-weight:600;font-size:14px;cursor:pointer;}

/* food/exercise picker */
.searchbar{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px 14px;font-size:15px;font-family:inherit;margin-bottom:12px;}
.searchbar:focus{outline:none;border-color:var(--text);}
.grouphdr{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 6px;}
.pick-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--hair);}
.pick-left{min-width:0;}
.pick-item .pn{font-size:14px;font-weight:500;}
.pick-item .pmeta{font-size:12px;color:var(--muted);}
.portrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.portchip{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:600;padding:5px 8px;border-radius:7px;cursor:pointer;font-family:inherit;}
.portchip:active{background:var(--surface2);}
.pick-add{background:var(--inv-bg);color:var(--inv-fg);border:none;border-radius:8px;width:34px;height:34px;font-size:20px;cursor:pointer;flex:none;}
.gramrow{display:flex;gap:6px;align-items:center;flex:none;}
.gram-inp{width:66px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 6px;font-size:14px;text-align:center;font-family:inherit;}
.exlib-item{padding:11px 0;border-bottom:1px solid var(--hair);}

/* editor */
.acc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);}
.acc-head{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;cursor:pointer;font-weight:700;font-size:14px;}
.acc-head .ar{color:var(--muted);}
.acc-body{padding:0 16px 16px;}
.editday{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;}
.editday-top{display:flex;gap:6px;align-items:center;margin-bottom:10px;}
.exrow-ed{display:grid;grid-template-columns:1fr 40px 60px;gap:6px;margin-bottom:6px;align-items:center;}
.exrow-ed2{display:flex;gap:6px;margin-bottom:12px;align-items:center;}
.minirow{display:flex;gap:6px;align-items:center;}
.sel{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px 6px;font-family:inherit;font-size:14px;}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:14px;flex:none;display:flex;align-items:center;justify-content:center;}
.iconbtn:disabled{opacity:.3;}
.lbl-sm{font-size:12px;font-weight:600;color:var(--muted);display:block;margin:14px 0 6px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.field label{font-size:13px;font-weight:600;color:var(--muted);}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:fit-content;}
.stepper button{background:transparent;border:none;color:var(--text);width:40px;height:40px;font-size:20px;cursor:pointer;}
.stepper .val{min-width:74px;text-align:center;font-weight:700;font-size:15px;}
.histitem{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.histitem .hd-l{font-weight:600;font-size:14px;}
.histitem .hd-d{font-size:12px;color:var(--muted);}
.dataarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;font-family:monospace;font-size:11px;min-height:80px;resize:vertical;}
.themebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

.restbar{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--inv-bg);color:var(--inv-fg);display:none;align-items:center;gap:12px;padding:12px 18px;}
.restbar.on{display:flex;}
.restbar .rt{font-weight:800;font-size:20px;min-width:58px;}
.restbar .rl{font-size:12px;font-weight:600;flex:1;text-transform:uppercase;letter-spacing:.5px;}
.restbar button{background:transparent;border:1px solid var(--inv-fg);color:var(--inv-fg);border-radius:8px;padding:7px 11px;font-weight:600;font-size:12px;cursor:pointer;}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
.navbtn{background:none;border:none;color:var(--muted);font-weight:600;font-size:10px;padding:10px 0 12px;cursor:pointer;border-top:2px solid transparent;margin-top:-1px;}
.navbtn--on{color:var(--text);border-top-color:var(--text);}
.navbtn svg{width:21px;height:21px;display:block;margin:0 auto 4px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
/* PR / Rekorde */
.prlist{display:flex;flex-direction:column;gap:8px;margin:10px 0;width:100%;text-align:left;}
.pritem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;}
.prstar{font-size:16px;}
.prname{font-weight:600;font-size:14px;}
.prdet{font-size:12px;color:var(--muted);}
.prdet b{color:var(--text);}
.prold{color:var(--muted);}
/* Kalorien-Ring */
.ringwrap{position:relative;width:150px;margin:4px auto 0;}
.ring{display:block;width:100%;}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.rt-num{font-weight:800;font-size:30px;line-height:1;}
.rt-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.rt-left{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600;}
.ovr{display:flex;align-items:center;gap:14px;}
.ovr-ring{flex:none;width:126px;}
.ovr-ring .ringwrap{width:126px;margin:0;}
.ovr-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;}
.ovr-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;}
.ovr-line .l{color:var(--muted);}
.ovr-line .v{font-weight:700;white-space:nowrap;}
/* Bibliothek-Filter */
.libchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch;}
.libchips .chip{flex:none;padding:9px 12px;font-size:13px;}
/* Satz +/- */
.setbtn{background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:12px;font-weight:600;padding:9px 12px;border-radius:9px;cursor:pointer;font-family:inherit;}
.setbtn:disabled{opacity:.35;}
.ex-name{cursor:pointer;}
.ex-i{color:var(--muted);font-size:13px;font-weight:400;}
/* Übungs-Info-Fenster */
.exmodal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:none;align-items:flex-end;justify-content:center;}
.exmodal.on{display:flex;}
.exmodal-card{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;max-width:480px;width:100%;max-height:84vh;overflow-y:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom));}
/* Belohnungs-Animation beim Essen-Hinzufügen (monochrom, blockiert die Bedienung nicht) */
.reward{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;pointer-events:none;padding:24px;}
.reward.on{display:flex;}
.reward-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 30px;text-align:center;max-width:300px;box-shadow:0 14px 44px rgba(0,0,0,.4);animation:rw-pop .42s cubic-bezier(.2,.8,.3,1.25) both;}
.reward.out .reward-card{animation:rw-out .34s ease forwards;}

/* Schichtrhythmus: wiederholender Zyklus ab Startdatum (hermes:rota).
   Manuelle Auswahl im Heute-Tab überschreibt den Rhythmus für den einzelnen Tag. */
function rotaShift(dateStr){
 const r=state.rota;
 if(!r||!r.start||!r.seq||!r.seq.length)return null;
 const d=Math.round((new Date(dateStr)-new Date(r.start))/86400000);
 if(isNaN(d))return null;
 const n=r.seq.length,i=((d%n)+n)%n;
 return r.seq[i];
}
function shiftModeEnabled(){return state.settings.shiftMode===true;}
function planningMode(){return shiftModeEnabled()?'shift':'daily';}
function effShift(dateStr){return shiftModeEnabled()?(state.shiftByDate[dateStr]||rotaShift(dateStr)||null):null;}
/* Schicht des Vortags (in LOKALER Zeit) — für „1. Tag nach Nacht = Schlaf". */
function prevShift(dateStr){const [y,m,d]=dateStr.split("-").map(Number);const pd=new Date(y,m-1,d-1);return effShift(dateKey(pd));}
/* Erster freier Tag direkt nach einem Nacht-Block: heute frei, gestern Nacht. */

/* ---------- Ernährungs-Berechnung ---------- */
function latestKg(){return state.bodyweight.length?state.bodyweight[state.bodyweight.length-1].kg:null;}
function targets(){
 const w=latestKg(),p=state.profile;
 if(!w)return null;
 const bmr=10*w+6.25*p.height-5*p.age+(p.sex==="m"?5:-161);
 const tdee=bmr*p.activity;
 let kcal=tdee;
 if(p.goal==="abnehmen")kcal-=500; else if(p.goal==="aufbau")kcal+=250; else if(p.goal==="recomp")kcal-=200;
 kcal=Math.round(kcal);
 // Body Recomp: Erhaltung mit leichtem Defizit + hohes Protein (mind. 2,0 g/kg).
 const protPerKg=p.goal==="recomp"?Math.max(2.0,state.settings.protein):state.settings.protein;
 const prot=Math.round(w*protPerKg);
 const fat=Math.round(w*0.8);
 const carbs=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
 return {kcal,p:prot,c:carbs,f:fat,fib:30,water:Math.round(w*35),
   vc:p.sex==="m"?90:75,vd:20,ca:1000,fe:p.sex==="m"?10:15,mg:p.sex==="m"?350:300,k:4000};
}
function consumedToday(){
 const day=state.foodLog[todayKey()]||[];
 const sum={};FKEYS.forEach(k=>sum[k]=0);
 day.forEach(e=>FKEYS.forEach(k=>sum[k]+=e.n[k]||0));
 sum.water=state.waterLog[todayKey()]||0;
 return sum;
}
/* Serie: aufeinanderfolgende Tage mit Essens-Einträgen (heute zählt, sobald etwas
   drin ist; sonst ab gestern rückwärts — die Serie reißt nicht schon morgens). */
function foodStreak(){

 while((state.foodLog[dateKey(d)]||[]).length){n++;d.setDate(d.getDate()-1);}
 return n;
}

function dayPlanTemplate(shift,day=todayKey()){
 shift=shiftModeEnabled()?shift:null;
 const next=dayById(state.nextDayId),train=next?next.label:"Training";
 const templates={
  frueh:[["05:00","Aufstehen & Wasser"],["05:30","Frühstück"],["06:00","Frühschicht"],["15:30",train+" – Training"],["17:30","Hauptmahlzeit"],["21:30","Schlaf vorbereiten"]],

  none:[["08:00","Aufstehen & Wasser"],["08:30","Frühstück"],["10:00",train+" – Training"],["12:30","Hauptmahlzeit"],["15:00","Zeit für eigene Vorhaben"],["18:00","Spaziergang / Bewegung"],["22:30","Schlaf vorbereiten"]],
 };

 return entries.map(([time,text])=>({id:uid(),time,text:trainedYesterday&&text.includes(' – Training')?'Erholung / freie Zeit':text,done:false,source:'template',dayOffset:shift==='nacht'&&time==='07:30'?1:0}));

function ensureDayPlan(day){

 if(old&&(old.mode||'shift')!==mode){
  // Keep each mode's edited plan so toggling never loses its appointments or progress.
  const {savedModes={},...previous}=old,variants={...savedModes,[old.mode||'shift']:previous},remembered=variants[mode];delete variants[mode];
  const personal=personalDayItems(old),base=dayPlanTemplate(shift,day).map(x=>({...x,done:!!old.items.find(p=>p.text===x.text)?.done})),items=sortDayItems([...base.filter(x=>!personal.some(p=>p.text===x.text)),...personal]);
  old={...(remembered||{shift,customized:personal.length>0,items}),mode,savedModes:variants};state.dayPlans={...state.dayPlans,[day]:old};saveDayPlans();
 }
 if(old&&old.shift==='nacht'&&old.items.some(x=>x.dayOffset===undefined)){old.items=old.items.map(x=>({...x,dayOffset:x.dayOffset===undefined&&x.time==='07:30'&&x.text==='Schlafen'?1:(x.dayOffset||0)}));saveDayPlans();}

 }

 if(/\b\d{1,2}[:.]\d{2}\b/.test(txt)&&!/\b(?:[01]?\d|2[0-3])[:.][0-5]\d\b/.test(txt))return null;
 const m=txt.match(/\b([01]?\d|2[0-3])(?:[:.]([0-5]\d)\s*(?:uhr)?|\s*uhr\b)/i)||txt.match(/(?<=\b(?:um|auf)\s)([01]?\d|2[0-3])(?![\d:.])/i);

 return {value:String(+m[1]).padStart(2,"0")+":"+(m[2]||"00"),raw:m[0],index:m.index};
}

function applyDayCommand(raw){
 const day=todayKey(),plan=ensureDayPlan(day),text=String(raw||"").trim();
 if(!text){state.dayPlanMsg="Sag oder schreib zuerst, was sich ändert.";return false;}
 const lower=text.toLowerCase(),tm=extractTime(text);let subject=cleanDaySubject(tm?text.replace(tm.raw,""):text);
 if(/\b(morgen|übermorgen|gestern)\b/.test(lower)){state.dayPlanMsg='Bitte bearbeite hier nur heute. Für morgen um 07:30: nutze „+ Termin“ und wähle „Folgetag“.';return false;}
 if(/\d/.test(text)&&!tm){state.dayPlanMsg='Bitte gib eine gültige Uhrzeit an, zum Beispiel 18:30 Uhr.';return false;}
 const remove=/löschen|lösche|entfern|streich|absagen|fällt\s+aus/.test(lower);
 const done=/erledigt|abhaken|markieren/.test(lower);
 const move=/verschieb|verleg|\bauf\b/.test(lower);
 const add=/hinzu|eintrag|einplan|\bplane\b|\bfüge\b/.test(lower);
 let items=[...plan.items],hit=findDayItem(items,subject);
 if(remove){
  if(!hit){state.dayPlanMsg="Ich finde „"+(subject||"diesen Punkt")+"“ nicht im Tagesplan.";return false;}
  items=items.filter(x=>x.id!==hit.id);state.dayPlanMsg="„"+hit.text+"“ wurde entfernt.";
 }else if(done){
  if(!hit){state.dayPlanMsg="Ich finde „"+(subject||"diesen Punkt")+"“ nicht im Tagesplan.";return false;}
  items=items.map(x=>x.id===hit.id?{...x,done:true}:x);state.dayPlanMsg="„"+hit.text+"“ ist erledigt.";
 }else if((move||(!add&&hit))&&tm){
  if(!hit){state.dayPlanMsg="Ich finde „"+(subject||"diesen Punkt")+"“ nicht im Tagesplan.";return false;}
  items=items.map(x=>x.id===hit.id?{...x,time:tm.value,source:'custom'}:x);sortDayItems(items);state.dayPlanMsg="„"+hit.text+"“ ist jetzt um "+tm.value+" Uhr.";
 }else if(tm&&subject&&(add||!plan.items.some(x=>x.text.toLowerCase().includes(subject.toLowerCase())))){
  items.push({id:uid(),time:tm.value,text:subject.charAt(0).toUpperCase()+subject.slice(1),done:false,source:'custom'});sortDayItems(items);state.dayPlanMsg="„"+subject+"“ wurde um "+tm.value+" Uhr eingeplant.";
 }else{
  state.dayPlanMsg="Das habe ich nicht verstanden. Beispiel: „Training auf 18 Uhr verschieben“ oder „Arzt um 10:30 hinzufügen“.";return false;
 }
 updateDayPlan(day,{...plan,customized:true,items});return true;
}

function bodySVG(active){

function findExMeta(name){
 for(const g in EXLIB){const e=EXLIB[g].find(x=>x[0]===name);if(e)return {group:g,steps:e.slice(1)};}
 for(const d of state.plan){const e=d.exercises.find(x=>x.name===name);if(e)return {group:null,steps:e.steps||[]};}

}
function exerciseHistoryHtml(name){
 const records=state.history.flatMap(h=>{const ex=h.exercises?.find(e=>e.name===name);if(!ex)return [];const best=ex.sets.filter(s=>s.done&&s.type!=='warmup').map(s=>({set:s,score:setScore(ex.unit,s.weight,s.reps)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score)[0];return best?[{date:h.date,unit:ex.unit,...best}]:[];});
 if(!records.length)return '';

 const coords=recent.map((r,i)=>[recent.length===1?120:10+i*220/(recent.length-1),68-(r.score-low)/range*52]);
 const line=coords.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
 const chart=`<svg class="ex-history-chart" viewBox="0 0 240 80" role="img" aria-label="Leistungsverlauf über ${recent.length} Einheiten"><line x1="10" y1="68" x2="230" y2="68" stroke="var(--line)"/><polyline points="${line}" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${coords.map(([x,y])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="var(--text)"/>`).join('')}</svg>`;
 const rows=records.slice(-5).reverse().map(r=>`<div class="ex-history-item"><span>${fmtFull(r.date)}</span><b>${esc(r.unit==='kg'?`${r.set.weight} kg × ${r.set.reps}`:`${r.set.reps} ${UNITS[r.unit]?.r||''}`)}</b></div>`).join('');
 return `<div class="exm-sec" id="exHistory">Übungsverlauf</div>${chart}<p class="muted sm" style="margin:4px 0 0">${recent.length>1?'Kurve: beste Leistung je Einheit.':'Deine erste erfasste Einheit.'}${recent[0].unit==='kg'?' Bei kg als geschätzte Stärke verglichen.':''}</p>${rows}`;

function workoutSummary(session,prs=[],inSheet=false){

letion-detail"><span>Deine Notiz</span><b style="overflow-wrap:anywhere;max-width:65%">${esc(session.note)}</b></div>`:''}</section>`;
}

/* Gesundheits-Begründung aus dem Nährstoffprofil (pro 100 g) — skaliert auf alle
   Lebensmittel inkl. eigener. Grenzwerte grob nach „nennenswerter Menge je 100 g". */
function foodHealth(f){
 const n=f.n||{},out=[];
 if((n.p||0)>=15)out.push(["Eiweißreich","Viel Protein — der Baustein für Muskelaufbau und -erhalt, hält außerdem lange satt."]);
 if((n.fib||0)>=5)out.push(["Ballaststoffreich","Fördert die Verdauung, hält lange satt und stabilisiert den Blutzucker."]);
 if((n.vc||0)>=15)out.push(["Vitamin C","Stärkt das Immunsystem und schützt die Zellen als Antioxidans."]);
 if((n.vd||0)>=1)out.push(["Vitamin D","Wichtig für Knochen, Muskelkraft und das Immunsystem."]);
 if((n.ca||0)>=120)out.push(["Calcium","Baut Knochen und Zähne auf und hält sie stark."]);
 if((n.fe||0)>=2)out.push(["Eisen","Für den Sauerstofftransport im Blut — beugt Müdigkeit vor."]);
 if((n.mg||0)>=50)out.push(["Magnesium","Unterstützt Muskeln, Nerven und den Energiestoffwechsel."]);
 if((n.k||0)>=300)out.push(["Kalium","Reguliert Blutdruck und Flüssigkeitshaushalt, wichtig für die Muskeln."]);
 if((n.kcal||0)<=60&&(n.f||0)<5)out.push(["Kalorienarm","Wenig Kalorien bei viel Volumen — ideal zum Sattessen im Defizit."]);
 return out;
}

/* ---- Barcode-Scanner (Open Food Facts) ----
   Android: eingebaute BarcodeDetector-API. iPhone & Co.: ZXing-Bibliothek (bei Bedarf
   einmal aus dem CDN nachgeladen, danach vom Service Worker offline gecacht). */
let scanStream=null,scanTimer=null,zxingReader=null;
const ZXING_SRC="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
function setScanStatus(t){const el=document.getElementById("scanStatus");if(el)el.textContent=t;}
function loadZXing(){return new Promise((resolve,reject)=>{if(window.ZXing)return resolve();const s=document.createElement("script");s.src=ZXING_SRC;s.onload=()=>resolve();s.onerror=()=>reject(new Error("zxing"));document.head.appendChild(s);});}
async function openScanner(){
 const ov=document.getElementById("scanoverlay");ov.classList.add("on");
 const mi=document.getElementById("scanManual");if(mi)mi.value="";
 const v=document.getElementById("scanvideo");
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setScanStatus("Keine Kamera verfügbar — bitte Barcode-Nummer unten eintippen.");return;}
 setScanStatus("Kamera wird gestartet …");
 if("BarcodeDetector"in window){
  try{
   scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
   v.srcObject=scanStream;await v.play();
   let detector;try{detector=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});}catch{detector=new BarcodeDetector();}
   setScanStatus("Barcode ruhig vor die Kamera halten …");
   scanTimer=setInterval(async()=>{try{const codes=await detector.detect(v);if(codes&&codes.length){const code=codes[0].rawValue;stopCamera();lookupBarcode(code);}}catch{}},500);
  }catch(e){setScanStatus("Kamerazugriff abgelehnt oder nicht möglich — bitte Barcode-Nummer unten eintippen.");}
  return;
 }
 // iPhone & Co.: ZXing
 try{
  await loadZXing();
  zxingReader=new ZXing.BrowserMultiFormatReader();
  setScanStatus("Barcode ruhig vor die Kamera halten …");
  await zxingReader.decodeFromConstraints({video:{facingMode:{ideal:"environment"}}},v,(result,err)=>{if(result){const code=result.getText();stopCamera();lookupBarcode(code);}});
 }catch(e){setScanStatus("Scanner braucht beim ersten Mal Internet — sonst bitte Barcode-Nummer unten eintippen.");}
}
function stopCamera(){if(scanTimer){clearInterval(scanTimer);scanTimer=null;}if(zxingReader){try{zxingReader.reset();}catch{}zxingReader=null;}if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}const v=document.getElementById("scanvideo");if(v)v.srcObject=null;}
function closeScanner(){stopCamera();const ov=document.getElementById("scanoverlay");if(ov)ov.classList.remove("on");}
async function lookupBarcode(code){
 code=String(code||"").trim();if(!code){setScanStatus("Bitte eine Barcode-Nummer eingeben.");return;}
 setScanStatus("Suche Produkt "+code+" …");
 try{
  const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json?fields=product_name,generic_name,brands,nutriments");
  const j=await r.json();
  if(j.status!==1||!j.product){setScanStatus("Nicht gefunden ("+code+"). Nummer prüfen oder Produkt unten manuell anlegen.");return;}
  const p=j.product,nu=p.nutriments||{};
  let name=(p.product_name||p.generic_name||("Produkt "+code)).trim();
  if(p.brands)name+=" ("+String(p.brands).split(",")[0].trim()+")";
  const kcal=nu["energy-kcal_100g"]!=null?nu["energy-kcal_100g"]:(nu["energy_100g"]?nu["energy_100g"]/4.184:0);
  const n={};FKEYS.forEach(k=>n[k]=0);
  n.kcal=Math.round(kcal||0);n.p=+(nu.proteins_100g||0);n.c=+(nu.carbohydrates_100g||0);n.f=+(nu.fat_100g||0);n.fib=+(nu.fiber_100g||0);n.vc=Math.round((nu["vitamin-c_100g"]||0)*1000);
  if(!state.customFoods.find(f=>f.name===name)){state.customFoods=[...state.customFoods,{name,n}];save(K.custom,state.customFoods);}
  closeScanner();
  state.tab="essen";state.foodPicker=true;state.scanAdded=name;render();window.scrollTo(0,0);
 }catch(e){setScanStatus("Netzwerkfehler — Internet nötig für die Produktsuche. Später erneut versuchen.");}
}
function initScanner(){
 const cb=document.getElementById("scanCloseBtn");if(cb)cb.onclick=closeScanner;
 const sb=document.getElementById("scanSearchBtn");if(sb)sb.onclick=()=>{const mi=document.getElementById("scanManual");stopCamera();lookupBarcode(mi?mi.value:"");};
 const mi=document.getElementById("scanManual");if(mi)mi.onkeydown=e=>{if(e.key==="Enter"){stopCamera();lookupBarcode(mi.value);}};
}

function svgChart(bw){
 const W=440,H=200,pad={t:12,r:12,b:24,l:34},xs=W-pad.l-pad.r,ys=H-pad.t-pad.b;
 const kgs=bw.map(b=>b.kg);let min=Math.min(...kgs),max=Math.max(...kgs);if(min===max){min-=1;max+=1;}else{const m=(max-min)*0.15;min-=m;max+=m;}
 const n=bw.length,first=Date.parse(bw[0].date),spanMs=Date.parse(bw[n-1].date)-first,px=i=>pad.l+(spanMs===0?xs/2:(Date.parse(bw[i].date)-first)/spanMs*xs),py=v=>pad.t+ys-((v-min)/(max-min))*ys;
 const pts=bw.map((b,i)=>`${px(i).toFixed(1)},${py(b.kg).toFixed(1)}`).join(" ");
 const dots=bw.map((b,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(b.kg).toFixed(1)}" r="2.5" fill="var(--text)"/>`).join("");
 const yl=[max,(max+min)/2,min].map(v=>{const y=py(v);return `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--hair)"/><text class="axis" x="2" y="${y+3}">${v.toFixed(0)}</text>`;}).join("");
 const xl=`<text class="axis" x="${px(0)}" y="${H-6}">${fmtDate(bw[0].date)}</text><text class="axis" x="${px(n-1)}" y="${H-6}" text-anchor="end">${fmtDate(bw[n-1].date)}</text>`;
 const diff=+(bw[n-1].kg-bw[0].kg).toFixed(1);
 const span=(new Date(bw[n-1].date)-new Date(bw[0].date))/86400000;
 const wk=span>=7?` · Ø ${(diff/span*7>0?'+':'')}${(diff/span*7).toFixed(1)} kg/Woche`:"";
 return `<section class="card"><div class="eyebrow">Verlauf</div><svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">${yl}<polyline points="${pts}" fill="none" stroke="var(--text)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg><div class="trend">${diff>0?'+':''}${diff} kg seit Beginn${wk}</div></section>`;
}

 if(draft)return `<div class="template-toolbar"><button class="textbtn" data-templateback>← Vorlagen</button><button class="btn btn-sm" data-templatesave ${!draft.label.trim()||!draft.exercises.length?'disabled':''}>Speichern</button></div><section><label class="eyebrow" for="templateName">Name deiner Vorlage</label><input class="template-name" id="templateName" maxlength="80" value="${esc(draft.label)}" placeholder="Zum Beispiel: Rücken & Bizeps"><p class="training-caption">${draft.exercises.length} Übungen · ${draft.exercises.reduce((n,e)=>n+e.sets,0)} Sätze</p></section><div class="template-list">${draft.exercises.map((e,i)=>`<button class="template-ex" data-templateex="${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="copy"><b>${esc(e.name)}</b><small>${e.sets} Sätze · ${esc(e.reps)} ${UNITS[e.unit]?.r||'Wdh.'}</small></span><span aria-hidden="true">···</span></button>`).join('')||`<div class="template-empty"><span class="routine-icon" style="margin:auto">${NAVICONS.training}</span><h3>Dein Workout beginnt hier</h3><p>Wähle deine Übungen aus und stelle deine eigene Vorlage zusammen.</p></div>`}</div><button class="btn btn-ghost" data-templateadd>+ Übungen hinzufügen</button><p class="template-context">Tippe auf eine Übung, um sie zu ersetzen, Sätze anzupassen oder die Reihenfolge zu ändern. Änderungen werden mit „Speichern“ übernommen.</p>`;
 return `<div class="template-toolbar"><div><h2 class="training-section-title">Deine Vorlagen</h2><p class="training-caption">Deine Workouts, so wie du sie brauchst.</p></div><button class="btn btn-sm" data-templatenew>+ Vorlage</button></div><div class="routine-grid">${state.plan.map(d=>`<div class="template-tile"><button class="routine-card" data-templateopen="${d.id}" aria-label="Vorlage ${esc(d.label)} bearbeiten"><span class="routine-icon" aria-hidden="true">${NAVICONS.training}</span><b>${esc(d.label)}</b><p>${d.exercises.map(e=>esc(e.name)).join(' · ')||'Noch keine Übungen'}</p><small>${d.exercises.length} Übungen · ${d.exercises.reduce((n,e)=>n+e.sets,0)} Sätze</small></button><button class="quiet-icon template-more" data-templatemenu="${d.id}" aria-label="Optionen für Vorlage ${esc(d.label)}">···</button></div>`).join('')}</div><details class="disclosure" data-disclosure="wizard"><summary>Plan automatisch zusammenstellen</summary><div class="disclosure-content">${wizEditor()}</div></details>`;

function openTemplate(id){const original=state.plan.find(d=>d.id===id);state.templateDraft=original?JSON.parse(JSON.stringify(original)):{id:uid(),label:'',exercises:[]};state.templateOriginal=JSON.stringify(state.templateDraft);render();}
function leaveTemplate(){if(!state.templateDraft)return true;if(JSON.stringify(state.templateDraft)!==state.templateOriginal&&!confirm('Ungespeicherte Änderungen an dieser Vorlage verwerfen?'))return false;state.templateDraft=null;state.templateOriginal=null;return true;}
function saveTemplate(){const d=state.templateDraft;if(!d||!d.label.trim()||!d.exercises.length)return;persistWorkout();const active=!state.saved&&!!load(K.draft,null),copy=JSON.parse(JSON.stringify(d));copy.label=copy.label.trim();const i=state.plan.findIndex(x=>x.id===d.id);if(i<0)state.plan.push(copy);else state.plan[i]=copy;sP();state.templateDraft=null;state.templateOriginal=null;if(!active&&!state.saved)syncSession();render();notifyUser(active?'Vorlage gespeichert. Deine laufende Einheit bleibt unverändert.':'Vorlage gespeichert. Bereit für dein nächstes Training.');}
function showTemplateMenu(id){const day=state.plan.find(d=>d.id===id);if(!day)return;const active=!state.saved&&!!load(K.draft,null)&&state.trainDayId===id;
 trainingSheet(day.label,`<button class="sheet-action" data-tedit><span>Vorlage bearbeiten</span>↗</button><button class="sheet-action" data-tcopy><span>Vorlage duplizieren</span>＋</button><button class="sheet-action" data-tdelete ${state.plan.length<=1||active?'disabled':''}><span>Vorlage löschen<small>${active?'Beende zuerst die laufende Einheit.':state.plan.length<=1?'Mindestens eine Vorlage bleibt erhalten.':'Gespeicherte Trainings bleiben erhalten.'}</small></span>−</button>`,dialog=>{
 dialog.querySelector('[data-tedit]').onclick=()=>{dialog.close();openTemplate(id);};
 dialog.querySelector('[data-tcopy]').onclick=()=>{dialog.close();openTemplate(id);state.templateDraft.id=uid();state.templateDraft.label=day.label+' (Kopie)';state.templateDraft.exercises.forEach(e=>e.id=uid());render();};
 dialog.querySelector('[data-tdelete]').onclick=()=>{if(!confirm(`Vorlage „${day.label}“ löschen?`))return;dialog.close();state.plan=state.plan.filter(d=>d.id!==id);if(state.nextDayId===id){state.nextDayId=state.plan[0].id;save(K.nextDay,state.nextDayId);}sP();if(state.trainDayId===id)syncSession();render();notifyUser('Vorlage entfernt.');};
 });}
function showTemplateExercise(index){const draft=state.templateDraft,ex=draft?.exercises[index];if(!ex)return;
 trainingSheet(ex.name,`<button class="sheet-action" data-replaceexercise><span>Übung ersetzen<small>Eine andere Übung aus der Bibliothek wählen</small></span>↔</button><form class="sheet-form" id="templateExForm"><div class="form-pair"><label>Sätze<input class="inp" id="templateSets" type="number" inputmode="numeric" min="1" max="30" step="1" required value="${ex.sets}"></label><label>Wiederholungen / Dauer<input class="inp" id="templateReps" maxlength="30" required value="${esc(ex.reps)}" placeholder="8–12"></label></div><label>Erfassung<select class="sel" id="templateUnit">${Object.entries(UNITS).map(([key,u])=>`<option value="${key}" ${ex.unit===key?'selected':''}>${u.lbl}</option>`).join('')}</select></label><button class="btn" type="submit">Übernehmen</button></form><div class="template-actions"><button class="btn btn-ghost btn-sm" data-tup ${index===0?'disabled':''}>↑ Nach oben</button><button class="btn btn-ghost btn-sm" data-tdown ${index===draft.exercises.length-1?'disabled':''}>↓ Nach unten</button></div><button class="sheet-action" data-tremove><span>Aus Vorlage entfernen</span>−</button>`,dialog=>{
 dialog.querySelector('#templateExForm').onsubmit=e=>{e.preventDefault();const reps=dialog.querySelector('#templateReps').value.trim();if(!reps)return;ex.sets=+dialog.querySelector('#templateSets').value;ex.reps=reps;ex.unit=dialog.querySelector('#templateUnit').value;dialog.close();render();};
 dialog.querySelector('[data-replaceexercise]').onclick=()=>openExercisePicker({replace:index});
 const move=dir=>{const j=index+dir;[draft.exercises[index],draft.exercises[j]]=[draft.exercises[j],draft.exercises[index]];dialog.close();render();};
 dialog.querySelector('[data-tup]').onclick=()=>move(-1);dialog.querySelector('[data-tdown]').onclick=()=>move(1);
 dialog.querySelector('[data-tremove]').onclick=()=>{draft.exercises.splice(index,1);dialog.close();render();};
 });}
function exerciseLibrary(){const items=Object.entries(EXLIB).flatMap(([group,rows])=>rows.map(row=>({name:row[0],group,steps:row.slice(1)})));state.plan.flatMap(d=>d.exercises).forEach(e=>{if(!items.some(x=>x.name===e.name))items.push({name:e.name,group:'Eigene Übungen',steps:e.steps||[],unit:e.unit,reps:e.reps});});return items.sort((a,b)=>a.name.localeCompare(b.name,'de'));}
function newTemplateExercise(item){const known=state.plan.flatMap(d=>d.exercises).find(e=>e.name===item.name),unit=item.unit||known?.unit||(item.group==='Cardio'?'min':/Plank|Wandsitz|Hollow Hold/.test(item.name)?'s':item.group==='Core'||/Liegestütze|Klimmzüge/.test(item.name)?'bw':'kg');return {id:uid(),name:item.name,sets:3,reps:item.reps||known?.reps||(unit==='min'?'15–20':unit==='s'?'30–45':'8–12'),unit,steps:item.steps||[]};}
function openExercisePicker(target={}){
 const library=exerciseLibrary(),selected=new Set(),replace=Number.isInteger(target.replace)||Number.isInteger(target.session);
 trainingSheet(replace?'Übung ersetzen':'Übungen hinzufügen',`<div class="picker-tools"><input class="searchbar" id="templateSearch" aria-label="Übungen suchen" placeholder="Übung suchen …"><select class="sel" id="templateGroup" aria-label="Muskelgruppe"><option value="">Alle Muskelgruppen</option>${[...new Set(library.map(e=>e.group))].map(g=>`<option>${esc(g)}</option>`).join('')}</select></div><div class="picker-results">${library.map((e,i)=>`<button class="sheet-action" data-pickerex="${i}" aria-pressed="false"><b aria-hidden="true">${replace?'↔':'+'}</b><span>${esc(e.name)}<small>${esc(e.group)}</small></span></button>`).join('')}<p class="picker-empty" id="pickerEmpty" hidden>Keine passende Übung gefunden. Du kannst unten eine eigene anlegen.</p></div><div class="picker-footer">${replace?'':`<button class="btn" data-pickeradd disabled>Übungen auswählen</button>`}<button class="textbtn" data-pickercustom>+ Eigene Übung erstellen</button></div>`,dialog=>{
 const apply=items=>{if(Number.isInteger(target.session)){const old=state.log[target.session];if(!old)return;if(old.sets.some(s=>s.done||s.weight||s.reps)&&!confirm('Diese Übung ersetzen? Ihre eingetragenen Sätze werden zurückgesetzt. Die anderen Übungen bleiben erhalten.'))return;const e=items[0];state.log[target.session]={...e,note:lastExerciseNote(e.name),sets:Array.from({length:old.sets.length},()=>({weight:'',reps:'',done:false,type:'normal'}))};setUndo=null;ensureWorkoutStarted();persistWorkout();}else if(state.templateDraft){if(Number.isInteger(target.replace))state.templateDraft.exercises[target.replace]={...items[0],id:state.templateDraft.exercises[target.replace].id,sets:state.templateDraft.exercises[target.replace].sets};else state.templateDraft.exercises.push(...items);}dialog.close();render();if(Number.isInteger(target.session))notifyUser('Übung für diese Einheit ersetzt. Deine Vorlage bleibt erhalten.');};
 const filter=()=>{const norm=s=>s.toLocaleLowerCase('de').normalize('NFD').replace(/[\u0300-\u036f]/g,''),q=norm(dialog.querySelector('#templateSearch').value),g=dialog.querySelector('#templateGroup').value;let count=0;dialog.querySelectorAll('[data-pickerex]').forEach(b=>{const e=library[+b.dataset.pickerex];b.hidden=!(norm(e.name).includes(q)&&(!g||e.group===g));if(!b.hidden)count++;});dialog.querySelector('#pickerEmpty').hidden=count>0;};
 dialog.querySelector('#templateSearch').oninput=filter;dialog.querySelector('#templateGroup').onchange=filter;
 dialog.querySelectorAll('[data-pickerex]').forEach(b=>b.onclick=()=>{const i=+b.dataset.pickerex;if(replace)return apply([newTemplateExercise(library[i])]);if(selected.has(i))selected.delete(i);else selected.add(i);b.setAttribute('aria-pressed',selected.has(i));b.querySelector('b').textContent=selected.has(i)?'✓':'+';const add=dialog.querySelector('[data-pickeradd]');add.disabled=!selected.size;add.textContent=selected.size?`${selected.size} Übungen hinzufügen`:'Übungen auswählen';});
 const add=dialog.querySelector('[data-pickeradd]');if(add)add.onclick=()=>apply([...selected].map(i=>newTemplateExercise(library[i])));
 dialog.querySelector('[data-pickercustom]').onclick=()=>trainingSheet('Eigene Übung',`<form class="sheet-form" id="customTemplateExercise"><label>Name<input class="inp" id="customExName" maxlength="100" required placeholder="Zum Beispiel: Kabelzug eng"></label><label>Erfassung<select class="sel" id="customExUnit">${Object.entries(UNITS).map(([k,u])=>`<option value="${k}">${u.lbl}</option>`).join('')}</select></label><button class="btn" type="submit">${replace?'Übung ersetzen':'Zur Vorlage hinzufügen'}</button></form>`,sheet=>{sheet.querySelector('form').onsubmit=e=>{e.preventDefault();const name=sheet.querySelector('#customExName').value.trim();if(name)apply([newTemplateExercise({name,unit:sheet.querySelector('#customExUnit').value,steps:[]})]);};});
 });
}

sich nach deinem Gerät.':'Dein Browser bietet keine Vibration an. Visuelles Feedback ist weiterhin aktiv.'}</p>`;}

function dataEditor(){return `<div class="minirow" style="gap:8px"><button class="btn btn-ghost btn-sm" style="flex:1" data-download="1">Als Datei sichern</button><button class="btn btn-ghost btn-sm" style="flex:1" data-fileimport="1">Datei laden</button></div><input type="file" id="fileInput" accept="application/json,.json" style="display:none"><button class="btn btn-ghost btn-sm" data-export="1" style="margin-top:8px">Exportieren (kopieren)</button><textarea class="dataarea" id="dataArea" placeholder="Zum Importieren Text hier einfügen…" style="margin-top:10px"></textarea><div class="minirow" style="gap:8px;margin-top:8px"><button class="btn btn-ghost btn-sm" style="flex:1" data-import="1">Importieren</button><button class="btn btn-ghost btn-sm" style="flex:1" data-reset="1">Zurücksetzen</button></div><p class="muted sm" style="margin-top:10px">Daten liegen nur auf diesem Gerät. „Als Datei sichern" lädt eine Backup-Datei herunter, „Datei laden" spielt sie wieder ein.</p>`;}

 const dayId=state.libFor;
 let html="";

 </div>`;

function addExerciseToDay(dayId,name,steps){dayById(dayId).exercises.push({id:uid(),name,sets:3,reps:"8–12",unit:"kg",steps:steps||[]});sP();}

/* ---------- Wiring ---------- */
function wire(){
 navEl.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{if(!leaveTemplate())return;state.tab=b.dataset.tab;state.libFor=null;state.foodPicker=false;if(b.dataset.tab==="training")state.trainView="log";render();});
 main.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{if(!leaveTemplate())return;state.tab=b.dataset.go;if(b.dataset.go==="training")state.trainView="log";render();});
 // Heute
 main.querySelectorAll("[data-shift]").forEach(b=>b.onclick=()=>{const day=todayKey(),k=b.dataset.shift,sbd={...state.shiftByDate},oldPlan=state.dayPlans[day];if(sbd[day]===k)delete sbd[day];else sbd[day]=k;state.shiftByDate=sbd;save(K.shifts,sbd);state.dayPlanMsg='';render();notifyUser(oldPlan&&oldPlan.customized?'Schicht geändert. Dein angepasster Tagesplan bleibt erhalten.':'Tagesplan an die Schicht angepasst.');});
 main.querySelectorAll("[data-daydone]").forEach(b=>b.onclick=()=>{const day=todayKey(),p=ensureDayPlan(day);updateDayPlan(day,{...p,customized:true,items:p.items.map(x=>x.id===b.dataset.daydone?{...x,done:!x.done}:x)});render();});
 const dpa=main.querySelector("[data-dayapply]");if(dpa)dpa.onclick=()=>{const inp=document.getElementById("dayPlanCommand");if(applyDayCommand(inp&&inp.value))render();else{const msg=document.getElementById("dayPlanMsg");if(msg)msg.textContent=state.dayPlanMsg;}};
 const dpi=document.getElementById("dayPlanCommand");if(dpi)dpi.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(applyDayCommand(dpi.value))render();else{const msg=document.getElementById("dayPlanMsg");if(msg)msg.textContent=state.dayPlanMsg;}}};
 const dps=main.querySelector("[data-dayspeak]");if(dps)dps.onclick=startDaySpeech;
 const dpr=main.querySelector("[data-dayreset]");if(dpr)dpr.onclick=()=>{if(!confirm('Tagesvorlage neu laden? Deine heutigen Anpassungen werden ersetzt. Du kannst das anschließend rückgängig machen.'))return;const day=todayKey();updateDayPlan(day,{...ensureDayPlan(day),shift:effShift(day)||null,mode:planningMode(),customized:false,items:dayPlanTemplate(effShift(day),day)});taskEditor=null;state.dayPlanMsg='Tagesvorlage neu geladen.';render();};
 // Training
 main.querySelectorAll('[data-begin]').forEach(b=>b.onclick=()=>{const resume=b.dataset.begin===state.trainDayId&&!state.saved;if(!switchDay(b.dataset.begin))return;state.workoutMinimized=false;state.workoutOpen=true;ensureWorkoutStarted();render();if(resume)window.scrollTo(0,state.workoutScroll||0);});
 const back=main.querySelector('[data-workoutback]');if(back)back.onclick=()=>{state.workoutScroll=window.scrollY;state.workoutMinimized=true;render();};
 main.querySelectorAll('[data-exactions]').forEach(b=>b.onclick=()=>showExerciseActions(+b.dataset.exactions));
 const jump=main.querySelector('[data-exjump]');if(jump)jump.onclick=showExerciseJump;
 main.querySelectorAll("[data-trainview]").forEach(b=>b.onclick=()=>{if(b.dataset.trainview!==state.trainView&&!leaveTemplate())return;state.trainView=b.dataset.trainview;state.libFor=null;render();});
 main.querySelectorAll('[data-templateopen]').forEach(b=>b.onclick=()=>openTemplate(b.dataset.templateopen));
 main.querySelectorAll('[data-templatemenu]').forEach(b=>b.onclick=()=>showTemplateMenu(b.dataset.templatemenu));
 const tn=main.querySelector('[data-templatenew]');if(tn)tn.onclick=()=>openTemplate(null);
 const tb=main.querySelector('[data-templateback]');if(tb)tb.onclick=()=>{if(leaveTemplate())render();};
 const ts=main.querySelector('[data-templatesave]');if(ts)ts.onclick=saveTemplate;
 const ti=document.getElementById('templateName');if(ti)ti.oninput=()=>{state.templateDraft.label=ti.value;ts.disabled=!ti.value.trim()||!state.templateDraft.exercises.length;};
 main.querySelectorAll('[data-templateex]').forEach(b=>b.onclick=()=>showTemplateExercise(+b.dataset.templateex));
 const ta=main.querySelector('[data-templateadd]');if(ta)ta.onclick=()=>openExercisePicker();
 main.querySelectorAll('.exercise-card .ex-name').forEach(b=>{b.removeAttribute('data-exinfo');b.onclick=()=>showExerciseActions(+b.closest('.exercise-card').id.replace('exercise-',''));});
 main.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>switchDay(b.dataset.day));
 main.querySelectorAll('input[data-f]').forEach(inp=>inp.oninput=()=>{ensureWorkoutStarted();state.log[+inp.dataset.ei].sets[+inp.dataset.si][inp.dataset.f]=inp.value;});
 main.querySelectorAll('[data-exnote]').forEach(inp=>inp.oninput=()=>{ensureWorkoutStarted();state.log[+inp.dataset.exnote].note=inp.value;main.querySelector(`[data-notesummary="${inp.dataset.exnote}"]`).textContent=inp.value?'↳ '+inp.value:'+ Notiz hinzufügen';});

function findEx(di,ei){const d=dayById(di);return d?d.exercises.find(e=>e.id===ei):null;}
function moveEx(di,ei,dir){const d=dayById(di);const i=d.exercises.findIndex(e=>e.id===ei);const j=i+dir;if(j<0||j>=d.exercises.length)return;[d.exercises[i],d.exercises[j]]=[d.exercises[j],d.exercises[i]];sP();syncSession();render();}
function moveDay(di,dir){const i=state.plan.findIndex(d=>d.id===di);const j=i+dir;if(j<0||j>=state.plan.length)return;[state.plan[i],state.plan[j]]=[state.plan[j],state.plan[i]];sP();render();}
function syncSession(){if(!state.plan.find(d=>d.id===state.trainDayId))state.trainDayId=state.plan[0].id;state.log=buildLog(state.trainDayId);}

function doExport(){const dump={};Object.values(K).forEach(k=>{const v=localStorage.getItem(k);if(v)dump[k]=v;});const txt=JSON.stringify(dump);const ta=document.getElementById("dataArea");if(ta)ta.value=txt;if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>alert("Kopiert.")).catch(()=>{});}
function doImport(){const ta=document.getElementById("dataArea");if(!ta||!ta.value.trim())return;try{applyImportObj(JSON.parse(ta.value.trim()));alert("Geladen.");}catch{alert("Text unlesbar — bitte vollständigen Export einfügen.");}}
function doReset(){if(!confirm("Wirklich ALLE Daten löschen?"))return;Object.values(K).forEach(k=>localStorage.removeItem(k));dayUndo=null;taskEditor=null;reloadState();}
function applyImportObj(obj){
 const record=v=>v!==null&&typeof v==='object'&&!Array.isArray(v),str=v=>typeof v==='string',num=v=>Number.isFinite(v),date=v=>str(v)&&/^\d{4}-\d{2}-\d{2}$/.test(v);
 const exercise=e=>record(e)&&str(e.name)&&Array.isArray(e.sets)&&e.sets.every(record);
 const dayPlanEntry=p=>record(p)&&(!('mode' in p)||['daily','shift'].includes(p.mode))&&Array.isArray(p.items)&&p.items.every(x=>record(x)&&str(x.id)&&str(x.text)&&/^([01]\d|2[0-3]):[0-5]\d$/.test(x.time));
 const validators={
  [K.plan]:v=>Array.isArray(v)&&v.length>0&&v.every(d=>record(d)&&str(d.id)&&str(d.label)&&Array.isArray(d.exercises)&&d.exercises.every(e=>record(e)&&str(e.name)&&num(e.sets)&&e.sets>0&&str(e.reps)&&['kg','s','bw','min'].includes(e.unit))),
  [K.weight]:v=>Array.isArray(v)&&v.every(x=>record(x)&&date(x.date)&&num(x.kg)&&x.kg>0),
  [K.history]:v=>Array.isArray(v)&&v.every(x=>record(x)&&str(x.date)&&str(x.dayLabel)&&Array.isArray(x.exercises)&&x.exercises.every(exercise)),
  [K.custom]:v=>Array.isArray(v)&&v.every(x=>record(x)&&str(x.name)&&record(x.n)),
  [K.nextDay]:v=>v===null||str(v),
  [K.food]:v=>record(v)&&Object.values(v).every(a=>Array.isArray(a)&&a.every(x=>record(x)&&str(x.name)&&num(x.grams)&&record(x.n))),
  [K.water]:v=>record(v)&&Object.values(v).every(x=>num(x)&&x>=0),
  [K.acts]:v=>record(v)&&Object.values(v).every(a=>Array.isArray(a)&&a.every(x=>record(x)&&str(x.name)&&num(x.min)&&num(x.kcal))),
  [K.shifts]:v=>record(v)&&Object.values(v).every(x=>Object.hasOwn(SHIFTS,x)),
  [K.rota]:v=>record(v)&&str(v.start)&&Array.isArray(v.seq)&&v.seq.every(x=>Object.hasOwn(SHIFTS,x)),
  [K.dayPlans]:v=>record(v)&&Object.values(v).every(p=>dayPlanEntry(p)&&(!('savedModes' in p)||(record(p.savedModes)&&Object.entries(p.savedModes).every(([mode,plan])=>['daily','shift'].includes(mode)&&dayPlanEntry(plan)&&!('savedModes' in plan))))),
  [K.draft]:v=>v===null||(record(v)&&str(v.dayId)&&Array.isArray(v.log)&&v.log.every(exercise)),
  [K.settings]:v=>record(v)&&(!('theme' in v)||Object.hasOwn(THEMES,v.theme))&&['shiftMode','haptics'].every(k=>!(k in v)||typeof v[k]==='boolean')&&(!('backgroundVisibility' in v)||(num(v.backgroundVisibility)&&v.backgroundVisibility>=10&&v.backgroundVisibility<=60))&&['rest','protein'].every(k=>!(k in v)||(num(v[k])&&v[k]>=0)),
  [K.background]:validBackground,
  [K.profile]:v=>record(v)&&['age','height','activity'].every(k=>!(k in v)||(num(v[k])&&v[k]>0)),
  [K.last]:v=>record(v)&&Object.values(v).every(record),[K.pr]:v=>record(v)&&Object.values(v).every(x=>record(x)&&str(x.date))
 };
 if(!record(obj))throw new Error('Invalid backup');
 const entries=Object.entries(obj).filter(([k])=>Object.values(K).includes(k)).map(([k,v])=>[k,typeof v==='string'?JSON.parse(v):v]);
 if(!entries.length||entries.some(([k,v])=>!validators[k]?.(v)))throw new Error('Invalid backup contents');
 const previous=entries.map(([k])=>[k,localStorage.getItem(k)]);
 try{entries.forEach(([k,v])=>localStorage.setItem(k,JSON.stringify(v)));}catch(error){previous.forEach(([k,v])=>{try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch{}});throw error;}
 reloadState();
}
function doDownload(){const dump={};Object.values(K).forEach(k=>{const v=localStorage.getItem(k);if(v)dump[k]=v;});const blob=new Blob([JSON.stringify(dump,null,0)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="hermes-backup-"+todayKey()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function doFileImport(){const inp=document.getElementById("fileInput");if(!inp)return;inp.value="";inp.onchange=()=>{const file=inp.files&&inp.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{applyImportObj(JSON.parse(String(r.result)));alert("Geladen.");}catch{alert("Datei unlesbar — bitte eine Hermes-Backup-Datei wählen.");}};r.readAsText(file);};inp.click();}
function reloadState(){
 state.plan=load(K.plan,defaultPlan());state.settings=readSettings();state.background=load(K.background,null);
 state.profile=Object.assign({sex:"m",age:30,height:180,activity:1.375,goal:"abnehmen"},load(K.profile,{}));
 state.bodyweight=load(K.weight,[]);state.history=load(K.history,[]);state.lastBest=load(K.last,{});state.prs=load(K.pr,{});state.lastPRs=[];
 state.shiftByDate=load(K.shifts,{});state.nextDayId=load(K.nextDay,null);state.foodLog=load(K.food,{});state.waterLog=load(K.water,{});state.customFoods=load(K.custom,[]);state.activityLog=load(K.acts,{});state.rota=load(K.rota,{start:"",seq:[]});state.dayPlans=load(K.dayPlans,{});state.dayPlanMsg="";
 if(!state.plan.length)state.plan=defaultPlan();if(!state.plan.find(d=>d.id===state.nextDayId))state.nextDayId=state.plan[0].id;
 state.trainDayId=state.nextDayId;state.log=buildLog(state.nextDayId);state.saved=false;state.note="";state.startedAt=null;state.acc={};state.libFor=null;state.foodPicker=false;state.actAdding=false;
 state.workoutOpen=false;state.workoutMinimized=false;state.workoutScroll=0;
 state.templateDraft=null;state.templateOriginal=null;
 dayUndo=null;taskEditor=null;stopRest();if(!load(K.plan,null))sP();restoreWorkout();applyTheme();render();
}

/* Icon: Apple-Touch-Icon (PNG) zur Laufzeit erzeugen — iOS nutzt kein SVG-Manifest-Icon.
   Manifest + Icon für Android/Install liegen statisch als manifest.json / icon.svg vor. */
function buildIcon(size){const c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d");x.fillStyle="#0A0A0A";const r=size*0.22;x.beginPath();x.moveTo(r,0);x.arcTo(size,0,size,size,r);x.arcTo(size,size,0,size,r);x.arcTo(0,size,0,0,r);x.arcTo(0,0,size,0,r);x.closePath();x.fill();x.fillStyle="#F2F0EB";x.font="bold "+(size*0.6)+"px Inter, sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText("H",size*0.5,size*0.54);return c.toDataURL("image/png");}
try{document.getElementById("appleicon").href=buildIcon(192);}catch(e){console.warn(e);}

/* Service Worker für Offline-Nutzung registrieren. */
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js",{updateViaCache:'none'}).catch(e=>console.warn("SW:",e));});}

const exmodalEl=document.getElementById("exmodal");
exmodalEl.onclick=e=>{if(e.target===exmodalEl)closeExInfo();};

if(!load(K.plan,null))sP();restoreWorkout();applyTheme();initScanner();render();
document.addEventListener('visibilitychange',()=>{if(document.hidden){flushSetRemovals();persistWorkout();}else if(activeDate!==todayKey()){activeDate=todayKey();taskEditor=null;dayUndo=null;state.dayPlanMsg='';render();}});
window.addEventListener('pagehide',()=>{flushSetRemovals();persistWorkout();});
setInterval(()=>{if(!document.hidden&&activeDate!==todayKey()){activeDate=todayKey();taskEditor=null;dayUndo=null;state.dayPlanMsg='';render();}},30000);
setInterval(()=>{const el=document.getElementById('workoutElapsed');if(el&&state.startedAt&&!document.hidden)el.textContent=fmtElapsed(Math.floor((Date.now()-state.startedAt)/1000));},1000);
window.addEventListener('offline',()=>notifyUser('Du bist offline. Deine Einträge bleiben auf diesem Gerät.'));
window.addEventListener('online',()=>notifyUser('Wieder online.'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeExInfo();});
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button||button.disabled||button.matches('[data-check],[data-save],[data-endsession],[data-water],[data-settheme],[data-removeset],[data-undoset],[data-hapticstoggle]'))return;buzz('tap');});
</script>
